<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login or Sign Up | Creator Link Hub</title>
  <link rel="stylesheet" href="signup_styles.css">
  <script src="signup.js" defer></script>
</head>

<body>

   <!-- Logo -->
      <nav class="navbar">
           <a href="Homepage.html">
             <img src="Hub Logo 2.png" class="logo" alt="Logo">
           </a>
        </nav>
    
        <div class="container">  
        <!-- Heading -->
    <h1>Join Link Hub</h1>
    <p class="subtitle">Sign up for free!</p>

    <!-- Form -->
    <form>
      <input type="email" id="username" name="username" placeholder="Email" required>
      <button type="submit" class="primary-btn" id="continueBtn" disabled>Continue</button>
    </form>
    <p id="errorMsg" class="error"></p>

    <!-- Terms -->
    <p class="terms">
      By clicking <strong>Create account</strong>, you agree to our
      <a href="#">privacy notice</a>, <a href="#">T&Cs</a>
      and to receive updates.
    </p>

    <!-- Divider -->
    <div class="divider">
      <span>OR</span>
    </div>

    <!-- Social Buttons -->
    <button class="social-btn">
      <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/google/google-original.svg" alt="">
      Continue with Google
    </button>

    <button class="social-btn">
      <img src="https://upload.wikimedia.org/wikipedia/commons/f/fa/Apple_logo_black.svg" alt="">
      Continue with Apple
    </button>

    <!-- Login Link -->
    <p class="login-text">
      Already have an account? <a href="login.html">Log in</a>
    </p>

  </div>

</body>
</html>
